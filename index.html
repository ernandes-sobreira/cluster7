function norm(s){return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function esc(s){return (s||'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function initials(name){return (name||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function tokens(s){return [...new Set(norm(s).replace(/[^a-z0-9\s-]/g,' ').split(/\s+/).filter(x=>x.length>2&&!STOP.has(x)))]}

 .coop-tools{display:grid;grid-template-columns:1.5fr .8fr .7fr;gap:9px;margin:14px 0}.coop-tools input,.coop-tools select{width:100%;padding:11px 12px;border:2px solid #E2E8F0;background:#fff;border-radius:10px;font-family:Sora,sans-serif;font-size:12px;outline:none;color:#1E293B}.coop-tools input:focus,.coop-tools select:focus{border-color:#00C896}.coop-programs{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 15px}.coop-prog{background:#fff;border:1px solid #E2E8F0;border-radius:999px;padding:6px 10px;font-size:9px;font-weight:700;cursor:pointer;color:#475569}.coop-prog:hover{border-color:#00C896}.coop-prog b{color:#7B5EA7}.coop-prog.active{background:#0D1B2A;color:#fff;border-color:#0D1B2A}.coop-prog.active b{color:#00C896}.coop-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:18px 0 11px}.coop-head h3{font-size:17px;color:#0D1B2A}.coop-count{font-size:10px;color:#94A3B8}.coop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}.coop-card{background:#fff;border:1px solid #e8edf2;border-radius:14px;padding:15px;box-shadow:0 3px 16px rgba(0,0,0,.05);position:relative}.coop-top{display:flex;gap:11px;align-items:center;padding-right:58px}.coop-av{width:44px;height:44px;flex:0 0 44px;border-radius:12px;background:linear-gradient(135deg,#00C896,#7B5EA7);display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px}.coop-name{font-size:12px;font-weight:800;color:#0D1B2A;line-height:1.35}.coop-inst{font-size:9px;color:#7B5EA7;font-weight:700;margin-top:2px}.coop-status{position:absolute;top:12px;right:11px;font-size:7px;text-transform:uppercase;letter-spacing:.5px;padding:3px 6px;border-radius:99px;background:#eafaf5;color:#08765c;font-weight:800}.coop-status.colaborador{background:#fff5d7;color:#876400}.coop-status.associado{background:#f1eafb;color:#63468b}.coop-status.docente{background:#e8f3ff;color:#1f5d91}.coop-area{margin-top:11px;font-size:10px;color:#475569;line-height:1.55}.coop-a function addUI(w,d){
 if(d.getElementById('tab-cooperation'))return;
 const nav=d.getElementById('mainNav');if(nav){const b=d.createElement('button');b.className='nb';b.dataset.tab='cooperation';b.textContent='🤝 Cooperação';const s=nav.querySelector('[data-tab="scoreboard"]');nav.insertBefore(b,s||null);b.onclick=()=>{w.switchTab('cooperation');loadCoop(w,d)}}
 const mm=d.querySelector('.mm-inner');if(mm){const b=d.createElement('button');b.className='mm-btn';b.dataset.tab='cooperation';b.textContent='🤝 Cooperação';const s=mm.querySelector('[data-tab="scoreboard"]');mm.insertBefore(b,s||null);b.onclick=()=>{w.switchTab('cooperation');loadCoop(w,d)}}
 const sec=d.createElement('section');sec.id='tab-cooperation';sec.className='tab';sec.innerHTML=`

 <div class="coop-find"><button id="coopFindBtn">Encontrar parceiros</button><small>O motor usa somente competências e linhas registradas no banco. Perfis ainda sem área detalhada não são forçados no ranking.</small></div></div>

function setMode(d,m){coopMode=m;d.querySelectorAll('.coop-mode').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));const L=d.getElementById('coopBriefLabel'),B=d.getElementById('coopBrief');if(m==='research'){L.textContent='Projeto / problema científico';B.placeholder='Ex.: Quero estudar calor, qualidade do ar e saúde no Pantanal usando séries climáticas e MP2,5...'}else if(m==='person'){L.textContent='Descreva quem você precisa';B.placeholder='Ex.: Preciso de alguém que trabalhe com microplásticos em água e análise de contaminantes...'}else{L.textContent='Ação que você quer montar';B.placeholder='Ex.: Quero montar um artigo comparando qualidade da água em diferentes regiões do Brasil...'}}
async function loadCoop(w,d){try{if(!coopData){const r=await fetch('dados/docentes_base_2026.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('banco');coopData=await r.json();buildPeople();setupFilters(d)}renderBank(d)}catch(e){d.getElementById('coopGrid').innerHTML='<div class="coop-empty">Não foi possível carregar o banco.</div>'}}
function buildPeople(){coopPeople=[];(coopData.programas||[]).forEach(p=>(p.docentes||[]).forEach(x=>coopPeople.push({name:x[0]||'',status:x[1]||'docente',area:x[2]||'',linha:x[3]||'',ppg:p.ppg,ies:p.ies,fonte:p.fonte||'',fonte_url:p.fonte_url||''})))}
function setupFilters(d){const ps=(coopData.programas||[]).map(p=>({key:p.ppg+'|'+p.ies,label:p.ppg+' • '+p.ies,n:(p.docentes||[]).length}));const sel=d.getElementById('coopProgram'),org=d.getElementById('coopOrigin'),chips=d.getElementById('coopPrograms');sel.innerHTML='<option value="">Todos os PPGs</option>'+ps.map(p=>`<option value="${esc(p.key)}">${esc(p.label)} (${p.n})</option>`).join('');org.innerHTML='<option value="">Não informar</option>'+ps.map(p=>`<option value="${esc(p.key)}">${esc(p.label)}</option>`).join('');chips.innerHTML='<button class="coop-prog active" data-p="">TODOS <b>'+coopPeople.length+'</b></button>'+ps.map(p=>`<button class="coop-prog" data-p="${esc(p.key)}">${esc(p.label)} <b>${p.n}</b></button>`).join('');chips.querySelectorAll('.coop-prog').forEach(b=>b.onclick=()=>{sel.value=b.dataset.p;renderBank(d)});d.getElementById('coopTotal').textContent=coopPeople.length;d.getElementById('coopPPGs').textContent=ps.length;d.getElementById('coopAreas').textContent=coopPeople.filter(x=>x.area).length}
function renderBank(d){if(!coopData)return;const q=norm(d.getElementById('coopSearch').value),pk=d.getElementById('coopProgram').value,st=d.getElementById('coopStatus').value;d.querySelectorAll('.coop-prog').forEach(b=>b.classList.toggle('active',b.dataset.p===pk));const rows=coopPeople.filter(x=>(!pk||x.ppg+'|'+x.ies===pk)&&(!st||x.status===st)&&(!q||norm([x.name,x.ppg,x.ies,x.status,x.area,x.linha].join(' ')).includes(q)));d.getElementById('coopCount').textContent=rows.length+' resultado'+(rows.length===1?'':'s');const g=d.getElementById('coopGrid');if(!rows.length){g.innerHTML='<div class="coop-empty">Nenhum docente encontrado.</div>';return}g.innerHTML=rows.map(x=>`<article class="coop-card"><span class="coop-status ${esc(x.status)}">${esc(x.status)}</span><div class="coop-top"><div class="coop-av">${esc(initials(x.name))}</div><div><div class="coop-name">${esc(x.name)}</div><div class="coop-inst">${esc(x.ppg)} • ${esc(x.ies)}</div></div></div>${x.area?`<div class="coop-area">${esc(x.area)}</div>`:`<div class="coop-area empty">Competências individuais ainda em enriquecimento — nome e vínculo já validados.</div>`}${x.linha?`<div class="coop-line"><b>Linha:</b> ${esc(x.linha)}</div>`:''}${x.fonte_url?`<a class="coop-source" href="${esc(x.fonte_url)}" target="_blank" rel="noopener">↗ fonte oficial</a>`:''}</article>`).join('')}
function scorePerson(p,needTs,briefTs,haveTs,origin){if(!p.area&&!p.linha)return null;const area=norm(p.area),line=norm(p.linha),hay=area+' '+line,why=[];let s=0;const all=expand([...needTs,...briefTs]);all.forEach(t=>{if(!t)return;if(area.includes(t)){s+=needTs.includes(t)?15:9;why.push(t)}else if(line.includes(t)){s+=needTs.includes(t)?10:6;why.push(t)}});haveTs.forEach(t=>{if(hay.includes(t)&&!needTs.includes(t))s-=2});if(origin&&origin!==p.ppg+'|'+p.ies)s+=8;if(p.status==='permanente')s+=2;if(s<=0)return null;return {p,score:s,why:[...new Set(why)].slice(0,5)}}
function runMatch(w,d){if(!coopData){loadCoop(w,d).then(()=>runMatch(w,d));return}const brief=d.getElementById('coopBrief').value.trim(),have=d.getElementById('coopHave').value.trim(),need=d.getElementById('coopNeed').value.trim(),origin=d.getElementById('coopOrigin').value;if(!brief&&!need){w.toast&&w.toast('Descreva o problema ou o que você precisa.');return}const briefTs=tokens(brief),needTs=tokens(need),haveTs=tokens(have);let scored=coopPeople.map(p=>scorePerson(p,needTs,briefTs,haveTs,origin)).filter(Boolean).sort((a,b)=>b.score-a.score);if(!scored.length){d.getElementById('matchWrap').classList.add('show');d.getElementById('matchSummary').innerHTML='<h3>Nenhum match forte ainda</h3><p>O banco encontrou poucos perfis com competências detalhadas para esse pedido. Isso não significa que o Cluster não tenha especialistas; significa que esses perfis ainda precisam ser enriquecidos.</p>';d.getElementById('matchList').innerHTML='';coopMatches=[];coopTeam=[];renderTeam(d);return}const max=scored[0].score;coopMatches=scored.slice(0,12).map((x,i)=>({...x,display:Math.max(35,Math.min(98,Math.round(58+40*x.score/max-i*.8)))}));coopTeam=[];const used=new Set();for(const m of coopMatches){const k=m.p.ppg+'|'+m.p.ies;if(!used.has(k)&&coopTeam.length<4){coopTeam.push(m.p.name);used.add(k)}}renderMatches(d);renderTeam(d);const label=actionLabel(d.getElementById('coopAction').value);d.getElementById('matchWrap').classList.add('show');d.getElementById('matchSummary').innerHTML=`<h3>${coopMatches.length} parceiros potenciais • ${esc(label)}</h3><p>O ranking priorizou competências que aparecem no seu pedido e deu bônus para complementaridade entre PPGs quando você informou a origem. A equipe inicial tenta distribuir os nomes entre programas diferentes.</p>`;d.getElementById('matchWrap').scrollIntoView({behavior:'smooth',block:'start'})}
function renderMatches(d){const el=d.getElementById('matchList');el.innerHTML=coopMatches.map(m=>{const on=coopTeam.includes(m.p.name),why=m.why.length?m.why.join(' • '):'aderência ao conjunto do pedido';return `<article class="match-card"><div class="match-score">${m.display}/100</div><div class="match-name">${esc(m.p.name)}</div><div class="match-inst">${esc(m.p.ppg)} • ${esc(m.p.ies)}</div><div class="match-area">${esc(m.p.area||m.p.linha)}</div><div class="match-why"><b>Por que entrou:</b> ${esc(why)}<br><b>Papel potencial:</b> ${esc(roleFor(m))}</div><button class="match-pick ${on?'on':''}" data-name="${esc(m.p.name)}">${on?'✓ Na equipe':'+ Adicionar à equipe'}</button></article>`}).join('');el.querySelectorAll('.match-pick').forEach(b=>b.onclick=()=>{const n=b.dataset.name;coopTeam=coopTeam.includes(n)?coopTeam.filter(x=>x!==n):[...coopTeam,n];renderMatches(d);renderTeam(d)})}
function roleFor(m){const w=m.why.slice(0,2).join(' + ');return w?'especialista em '+w:'especialista complementar ao tema'}
function renderTeam(d){const box=d.getElementById('teamBox'),chips=d.getElementById('teamChips');if(!coopTeam.length){box.classList.remove('show');chips.innerHTML='';return}box.classList.add('show');chips.innerHTML=coopTeam.map(n=>{const p=coopPeople.find(x=>x.name===n);return `<span class="team-chip">${esc(n)} • ${esc(p?.ies||'')}</span>`}).join('')}
function actionLabel(v){return {coorientacao:'Coorientação',projeto:'Projeto multicêntrico / edital',artigo:'Artigo / revisão em rede',banca:'Banca / qualificação',disciplina:'Disciplina compartilhada',mobilidade:'Mobilidade / missão / visitante',dados:'Dados / infraestrutura / campo'}[v]||'Cooperação'}
function createProposal(w,d){if(!coopTeam.length){w.toast&&w.toast('Selecione pelo menos um parceiro.');return}const action=d.getElementById('coopAction').value,label=actionLabel(action),brief=d.getElementById('coopBrief').value.trim(),need=d.getElementById('coopNeed').value.trim(),have=d.getElementById('coopHave').value.trim();const team=coopTeam.map(n=>{const p=coopPeople.find(x=>x.name===n);return '- '+n+' ('+(p?.ppg||'')+' / '+(p?.ies||'')+') — '+(p?.area||p?.linha||'perfil em enriquecimento')}).join('\n');const desc=`Objetivo / problema:\n${brief||need}\n\nO que o grupo já tem:\n${have||'Não informado'}\n\nO que precisa fortalecer:\n${need||'Não informado'}\n\nEquipe sugerida pelo banco do Cluster 7:\n${team}\n\nAção proposta: ${label}.\n\nObservação: a sugestão é baseada em competências documentadas no banco e não confirma disponibilidade dos docentes.`;const type={artigo:'artigo',projeto:'edital',disciplina:'curso',mobilidade:'visita'}[action]||'outro';w.switchTab('proposals');w.resetModalToNew&&w.resetModalToNew('proposals');d.getElementById('prTitle').value='Cooperação Cluster 7 — '+label;d.getElementById('prType').value=type;d.getElementById('prDesc').value=desc;d.getElementById('prDeadline').value='';w.openM('mProposal');w.toast&&w.toast('Proposta preenchida. Revise e publique! 🚀')}
function inject(){try{const w=frame.contentWindow,d=frame.contentDocument;if(!d||!d.head||!d.body)return;if(!d.getElementById('coopInjectedStyles'))addStyles(d);addUI(w,d)}catch(e){console.error('Falha ao integrar Cooperação',e)}}
frame.addEventListener('load',()=>setTimeout(inject,150));
</script>
