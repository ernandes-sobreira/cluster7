<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CLUSTER 7</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#F4F6F9}
#clusterApp{display:block;width:100%;height:100%;border:0;background:#F4F6F9}
</style>
</head>
<body>
<iframe id="clusterApp" src="app.html" title="Cluster 7"></iframe>
<script>
const frame=document.getElementById('clusterApp');
let coopData=null;
let coopPeople=[];
function norm(s){return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function initials(name){return (name||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function esc(s){return (s||'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function addCoopStyles(d){
 const st=d.createElement('style');
 st.id='coopInjectedStyles';
 st.textContent=`
 .coop-hero{background:linear-gradient(135deg,#0D1B2A,#17324a 68%,#0b594d);border-radius:20px;padding:25px;color:white;margin-bottom:18px;position:relative;overflow:hidden}
 .coop-hero:after{content:'🤝';position:absolute;right:24px;top:2px;font-size:95px;opacity:.07}.coop-kicker{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;color:#00C896;font-weight:700}.coop-hero h2{font-size:27px;margin:7px 0 7px}.coop-hero p{color:#c8d2da;font-size:12px;line-height:1.65;max-width:760px}.coop-metrics{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.coop-metric{background:#ffffff12;border:1px solid #ffffff20;padding:8px 12px;border-radius:10px}.coop-metric b{font-family:'Space Mono',monospace;color:#00C896;font-size:18px}.coop-metric span{font-size:9px;color:#c8d2da;margin-left:5px}
 .coop-tools{display:grid;grid-template-columns:1.5fr .8fr .7fr;gap:9px;margin:14px 0}.coop-tools input,.coop-tools select{width:100%;padding:11px 12px;border:2px solid #E2E8F0;background:#fff;border-radius:10px;font-family:'Sora',sans-serif;font-size:12px;outline:none;color:#1E293B}.coop-tools input:focus,.coop-tools select:focus{border-color:#00C896}
 .coop-programs{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 15px}.coop-prog{background:#fff;border:1px solid #E2E8F0;border-radius:999px;padding:6px 10px;font-size:9px;font-weight:700;cursor:pointer;color:#475569}.coop-prog:hover{border-color:#00C896}.coop-prog b{color:#7B5EA7}.coop-prog.active{background:#0D1B2A;color:#fff;border-color:#0D1B2A}.coop-prog.active b{color:#00C896}
 .coop-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:18px 0 11px}.coop-head h3{font-size:17px;color:#0D1B2A}.coop-count{font-size:10px;color:#94A3B8}.coop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}.coop-card{background:#fff;border:1px solid #e8edf2;border-radius:14px;padding:15px;box-shadow:0 3px 16px rgba(0,0,0,.05);position:relative}.coop-top{display:flex;gap:11px;align-items:center;padding-right:58px}.coop-av{width:44px;height:44px;flex:0 0 44px;border-radius:12px;background:linear-gradient(135deg,#00C896,#7B5EA7);display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px}.coop-name{font-size:12px;font-weight:800;color:#0D1B2A;line-height:1.35}.coop-inst{font-size:9px;color:#7B5EA7;font-weight:700;margin-top:2px}.coop-status{position:absolute;top:12px;right:11px;font-size:7px;text-transform:uppercase;letter-spacing:.5px;padding:3px 6px;border-radius:99px;background:#eafaf5;color:#08765c;font-weight:800}.coop-status.colaborador{background:#fff5d7;color:#876400}.coop-status.associado{background:#f1eafb;color:#63468b}.coop-status.docente{background:#e8f3ff;color:#1f5d91}.coop-area{margin-top:11px;font-size:10px;color:#475569;line-height:1.55}.coop-area.empty{color:#94A3B8;font-style:italic}.coop-line{margin-top:7px;font-size:9px;color:#64748b;background:#F4F6F9;padding:6px 8px;border-radius:8px;line-height:1.45}.coop-source{display:inline-block;margin-top:10px;font-size:9px;color:#08765c;text-decoration:none;font-weight:700}.coop-source:hover{text-decoration:underline}
 .coop-call{background:linear-gradient(135deg,#eafaf5,#f2eef9);border:1px solid #dce9e4;border-radius:14px;padding:15px;margin:4px 0 14px}.coop-call b{font-size:13px;color:#0D1B2A}.coop-call p{font-size:10px;color:#64748b;line-height:1.55;margin-top:4px}.coop-empty{text-align:center;padding:36px;background:#fff;border-radius:14px;color:#94A3B8;font-size:12px}
 @media(max-width:760px){.coop-tools{grid-template-columns:1fr}.coop-hero h2{font-size:22px}.coop-grid{grid-template-columns:1fr}.coop-card{padding:14px}.coop-hero{padding:20px}.coop-hero:after{font-size:70px}}
 `;
 d.head.appendChild(st);
}
function addCoopUI(w,d){
 if(d.getElementById('tab-cooperation')) return;
 const nav=d.getElementById('mainNav');
 if(nav){
   const b=d.createElement('button'); b.className='nb'; b.dataset.tab='cooperation'; b.textContent='🤝 Cooperação';
   const score=nav.querySelector('[data-tab="scoreboard"]'); nav.insertBefore(b,score||null);
   b.addEventListener('click',()=>{w.switchTab('cooperation');loadCoop(w,d)});
 }
 const mm=d.querySelector('.mm-inner');
 if(mm){
   const b=d.createElement('button'); b.className='mm-btn'; b.dataset.tab='cooperation'; b.textContent='🤝 Cooperação';
   const score=mm.querySelector('[data-tab="scoreboard"]'); mm.insertBefore(b,score||null);
   b.addEventListener('click',()=>{w.switchTab('cooperation');loadCoop(w,d)});
 }
 const sec=d.createElement('section'); sec.id='tab-cooperation'; sec.className='tab';
 sec.innerHTML=`
 <div class="coop-hero">
   <div class="coop-kicker">BANCO REAL DE COMPETÊNCIAS • CLUSTER 7</div>
   <h2>Encontre quem pode colaborar com a sua pesquisa.</h2>
   <p>Docentes dos programas parceiros, com vínculo e competências rastreados em fontes oficiais. Busque por tema, método, nome ou programa para localizar possíveis coorientações, bancas, projetos e outras conexões.</p>
   <div class="coop-metrics"><div class="coop-metric"><b id="coopTotal">—</b><span>registros docentes</span></div><div class="coop-metric"><b id="coopPPGs">—</b><span>PPGs</span></div><div class="coop-metric"><b id="coopAreas">—</b><span>perfis já enriquecidos</span></div></div>
 </div>
 <div class="coop-call"><b>🧩 Quero montar uma cooperação</b><p>Digite abaixo o que você precisa — por exemplo: <i>climatologia urbana</i>, <i>peixes</i>, <i>justiça climática</i>, <i>bioestatística</i>, <i>qualidade da água</i> ou o nome de um docente. O banco filtra os potenciais parceiros.</p></div>
 <div class="coop-tools">
   <input id="coopSearch" placeholder="🔎 O que você precisa? Tema, método ou docente...">
   <select id="coopProgram"><option value="">Todos os PPGs</option></select>
   <select id="coopStatus"><option value="">Todos os vínculos</option><option value="permanente">Permanente</option><option value="docente">Docente</option><option value="colaborador">Colaborador</option><option value="associado">Associado</option></select>
 </div>
 <div id="coopPrograms" class="coop-programs"></div>
 <div class="coop-head"><h3>Docentes e competências</h3><div class="coop-count" id="coopCount"></div></div>
 <div class="coop-grid" id="coopGrid"><div class="coop-empty">Carregando banco de docentes...</div></div>`;
 d.querySelector('main').appendChild(sec);
 sec.querySelector('#coopSearch').addEventListener('input',()=>renderCoop(d));
 sec.querySelector('#coopProgram').addEventListener('change',()=>renderCoop(d));
 sec.querySelector('#coopStatus').addEventListener('change',()=>renderCoop(d));
}
async function loadCoop(w,d){
 try{
   if(!coopData){const r=await fetch('dados/docentes_base_2026.json?ts='+Date.now(),{cache:'no-store'}); if(!r.ok)throw new Error('Falha ao carregar banco'); coopData=await r.json(); buildPeople(); setupProgramFilters(d)}
   renderCoop(d);
 }catch(e){const g=d.getElementById('coopGrid');if(g)g.innerHTML='<div class="coop-empty">Não foi possível carregar o banco agora.</div>';console.error(e)}
}
function buildPeople(){
 coopPeople=[];
 (coopData.programas||[]).forEach(p=>(p.docentes||[]).forEach(x=>coopPeople.push({name:x[0]||'',status:x[1]||'docente',area:x[2]||'',linha:x[3]||'',ppg:p.ppg,ies:p.ies,fonte:p.fonte||'',fonte_url:p.fonte_url||''})));
}
function setupProgramFilters(d){
 const sel=d.getElementById('coopProgram'), chips=d.getElementById('coopPrograms'); if(!sel||!chips)return;
 const ps=(coopData.programas||[]).map(p=>({key:p.ppg+'|'+p.ies,label:p.ppg+' • '+p.ies,n:(p.docentes||[]).length}));
 sel.innerHTML='<option value="">Todos os PPGs</option>'+ps.map(p=>`<option value="${esc(p.key)}">${esc(p.label)} (${p.n})</option>`).join('');
 chips.innerHTML='<button class="coop-prog active" data-p="">TODOS <b>'+coopPeople.length+'</b></button>'+ps.map(p=>`<button class="coop-prog" data-p="${esc(p.key)}">${esc(p.label)} <b>${p.n}</b></button>`).join('');
 chips.querySelectorAll('.coop-prog').forEach(b=>b.addEventListener('click',()=>{sel.value=b.dataset.p;renderCoop(d)}));
 const enriched=coopPeople.filter(x=>x.area).length;
 d.getElementById('coopTotal').textContent=coopPeople.length;
 d.getElementById('coopPPGs').textContent=ps.length;
 d.getElementById('coopAreas').textContent=enriched;
}
function renderCoop(d){
 if(!coopData)return;
 const q=norm(d.getElementById('coopSearch')?.value), pk=d.getElementById('coopProgram')?.value||'', st=d.getElementById('coopStatus')?.value||'';
 d.querySelectorAll('.coop-prog').forEach(b=>b.classList.toggle('active',b.dataset.p===pk));
 const rows=coopPeople.filter(x=>{
   if(pk && x.ppg+'|'+x.ies!==pk)return false;
   if(st && x.status!==st)return false;
   if(q){const hay=norm([x.name,x.ppg,x.ies,x.status,x.area,x.linha].join(' '));if(!hay.includes(q))return false;}
   return true;
 });
 d.getElementById('coopCount').textContent=rows.length+' resultado'+(rows.length===1?'':'s');
 const grid=d.getElementById('coopGrid');
 if(!rows.length){grid.innerHTML='<div class="coop-empty">Nenhum docente encontrado com esses filtros. Tente outro termo.</div>';return;}
 grid.innerHTML=rows.map(x=>`<article class="coop-card"><span class="coop-status ${esc(x.status)}">${esc(x.status)}</span><div class="coop-top"><div class="coop-av">${esc(initials(x.name))}</div><div><div class="coop-name">${esc(x.name)}</div><div class="coop-inst">${esc(x.ppg)} • ${esc(x.ies)}</div></div></div>${x.area?`<div class="coop-area">${esc(x.area)}</div>`:`<div class="coop-area empty">Competências individuais em enriquecimento — nome e vínculo já validados.</div>`}${x.linha?`<div class="coop-line"><b>Linha:</b> ${esc(x.linha)}</div>`:''}${x.fonte_url?`<a class="coop-source" href="${esc(x.fonte_url)}" target="_blank" rel="noopener">↗ fonte oficial</a>`:''}</article>`).join('');
}
function inject(){
 try{
   const w=frame.contentWindow,d=frame.contentDocument;
   if(!d||!d.head||!d.body)return;
   if(!d.getElementById('coopInjectedStyles'))addCoopStyles(d);
   addCoopUI(w,d);
 }catch(e){console.error('Falha ao integrar Cooperação',e)}
}
frame.addEventListener('load',()=>{setTimeout(inject,150)});
</script>
</body>
</html>
